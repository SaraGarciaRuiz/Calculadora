<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <form>
        <label for="numero1">Introduce un numero</label>
        <input type="number" step="any" id="numero1">

        <label for ="operacion">operacion:</label>
        <select id="operacion" name="operacion">
            <option value="sumar">+</option>
            <option value="resta">-</option>
            <option value="multiplicacion">*</option>
            <option value="division">/</option>
            <option value="potencia">^</option>
            <option value="resto">%</option>
        </select>

        <label for="numero2">Introduce un numero</label>
        <input type="number" step="any" id="numero2">

        <button type="submit" id="calcular">Calcular</button>
        <button type="reset" id="limpiar">Limpiar</button>

        <h3 id="resultado"></h3>
    </form>


</body>
</html>
